name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Verify Pages uses GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [ "$pages_build_type" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions. Branch publishing must be disabled for this workflow."
            exit 1
          fi

      - name: Upload website files
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
